name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt
      - run: python -m pip install -r requirements-desktop-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests -q
