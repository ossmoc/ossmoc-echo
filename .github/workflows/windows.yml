name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt
      - run: python -m pip install -r requirements-desktop-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python tools/run_qa.py --output artifacts/ci-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-qa-${{ matrix.os }}
          path: |
            artifacts/ci-qa/report.json
            artifacts/ci-qa/junit.xml
            artifacts/ci-qa/pytest.log
          if-no-files-found: warn
